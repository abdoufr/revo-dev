<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion Admin | Dev Showcase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #15803d;
      --primary-light: #16a34a;
      --primary-glow: rgba(21, 128, 61, 0.15);
      --bg: #f0fdf4;
      --card-bg: #ffffff;
      --text: #111827;
      --text-muted: #6b7280;
      --border: #d1fae5;
      --error-bg: #fef2f2;
      --error-border: #fca5a5;
      --error-text: #dc2626;
      --shadow: 0 20px 60px rgba(0,0,0,0.08);
      --shadow-card: 0 4px 24px rgba(21, 128, 61, 0.12);
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Animated background pattern */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(21,128,61,0.06) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(21,128,61,0.04) 0%, transparent 50%);
      pointer-events: none;
    }

    /* Floating decorative elements */
    .deco {
      position: fixed;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(21,128,61,0.08) 0%, transparent 70%);
      pointer-events: none;
      animation: float 8s ease-in-out infinite;
    }
    .deco-1 { width: 400px; height: 400px; top: -100px; left: -100px; animation-delay: 0s; }
    .deco-2 { width: 300px; height: 300px; bottom: -80px; right: -80px; animation-delay: 3s; }
    .deco-3 { width: 200px; height: 200px; top: 50%; right: 10%; animation-delay: 1.5s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-20px) scale(1.05); }
    }

    .login-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      padding: 1.5rem;
    }

    /* Brand logo top */
    .brand {
      text-align: center;
      margin-bottom: 2rem;
    }
    .brand-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      color: white;
      margin-bottom: 1rem;
      box-shadow: 0 8px 32px rgba(21,128,61,0.25);
      animation: pulse-icon 3s ease-in-out infinite;
    }
    @keyframes pulse-icon {
      0%, 100% { box-shadow: 0 8px 32px rgba(21,128,61,0.25); }
      50% { box-shadow: 0 8px 48px rgba(21,128,61,0.4); }
    }
    .brand h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text);
    }
    .brand h1 span { color: var(--primary); }
    .brand p {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    /* Card */
    .card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border);
    }

    .card-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .card-header h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.25rem;
    }
    .card-header p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Form groups */
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.5rem;
    }

    .input-wrapper {
      position: relative;
    }
    .input-wrapper .input-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.9rem;
      transition: color 0.2s;
    }
    .input-wrapper input {
      width: 100%;
      padding: 0.85rem 1rem 0.85rem 2.75rem;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      color: var(--text);
      background: #f8fffe;
      transition: all 0.2s ease;
      outline: none;
    }
    .input-wrapper input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
      background: white;
    }
    .input-wrapper input:focus + .input-icon,
    .input-wrapper:focus-within .input-icon {
      color: var(--primary);
    }
    .input-wrapper .toggle-password {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      cursor: pointer;
      background: none;
      border: none;
      font-size: 0.9rem;
      padding: 0.25rem;
      transition: color 0.2s;
    }
    .input-wrapper .toggle-password:hover { color: var(--primary); }

    /* Error alert */
    .alert-error {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      border-radius: 12px;
      padding: 0.85rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      color: var(--error-text);
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 1.25rem;
      animation: shake 0.4s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .alert-error.hidden { display: none; }

    /* Submit button */
    .btn-login {
      width: 100%;
      padding: 0.95rem;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      border: none;
      border-radius: 12px;
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      transition: all 0.25s ease;
      box-shadow: 0 4px 16px rgba(21,128,61,0.25);
      margin-top: 0.5rem;
    }
    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(21,128,61,0.35);
      background: linear-gradient(135deg, #166534, var(--primary));
    }
    .btn-login:active { transform: translateY(0); }
    .btn-login.loading { pointer-events: none; opacity: 0.8; }
    .btn-login .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    .btn-login.loading .spinner { display: inline-block; }
    .btn-login.loading .btn-text { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Security badge */
    .security-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      margin-top: 1.5rem;
      font-size: 0.78rem;
      color: var(--text-muted);
    }
    .security-note i { color: var(--primary); font-size: 0.7rem; }

    @media (max-width: 480px) {
      .card { padding: 2rem 1.5rem; }
    }
  </style>
</head>
<body>

  <div class="deco deco-1"></div>
  <div class="deco deco-2"></div>
  <div class="deco deco-3"></div>

  <div class="login-wrapper">
    <div class="brand">
      <div class="brand-icon">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h1>Dev<span>Showcase</span></h1>
      <p>Panneau d'Administration Sécurisé</p>
    </div>

    <div class="card">
      <div class="card-header">
        <h2><i class="fa-solid fa-lock" style="color: var(--primary); margin-right: 0.4rem;"></i>Connexion</h2>
        <p>Entrez vos identifiants pour accéder au panneau admin</p>
      </div>

      <div id="alertError" class="alert-error hidden">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="alertMessage">Identifiants incorrects. Veuillez réessayer.</span>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Nom d'utilisateur</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-user input-icon"></i>
            <input type="text" id="username" name="username" placeholder="admin" autocomplete="username" required />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-key input-icon"></i>
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
            <button type="button" class="toggle-password" id="togglePwd" title="Afficher/masquer">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
          <div class="spinner"></div>
          <span class="btn-text"><i class="fa-solid fa-arrow-right-to-bracket"></i> Accéder au panneau</span>
        </button>
      </form>

      <div class="security-note">
        <i class="fa-solid fa-lock"></i>
        Connexion sécurisée par chiffrement bcrypt
      </div>
    </div>
  </div>



  <script>
    // Toggle password visibility
    document.getElementById('togglePwd').addEventListener('click', function () {
      const input = document.getElementById('password');
      const icon = this.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-regular fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fa-regular fa-eye';
      }
    });

    // Login form submit
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const btn = document.getElementById('loginBtn');
      const alertEl = document.getElementById('alertError');
      const alertMsg = document.getElementById('alertMessage');

      // Hide error and show loading
      alertEl.classList.add('hidden');
      btn.classList.add('loading');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          // Redirect to admin panel
          window.location.href = '/admin/dashboard';
        } else {
          alertMsg.textContent = data.error || 'Identifiants incorrects. Veuillez réessayer.';
          alertEl.classList.remove('hidden');
          // Re-trigger animation
          alertEl.style.animation = 'none';
          alertEl.offsetHeight; // reflow
          alertEl.style.animation = '';
        }
      } catch (err) {
        alertMsg.textContent = 'Erreur de connexion au serveur. Veuillez réessayer.';
        alertEl.classList.remove('hidden');
      } finally {
        btn.classList.remove('loading');
      }
    });
  </script>
</body>
</html>
