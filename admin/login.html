<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion Admin | Revo Dev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #15803d;
      --primary-hover: #166534;
      --primary-light: #22c55e;
      --primary-glow: rgba(21, 128, 61, 0.25);
      --bg-page: #f0fdf4;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border-color: #dcfce7;
      --shadow-card: 0 20px 50px rgba(0, 0, 0, 0.08);
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg-page);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Decorative Elements */
    .deco {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }
    .deco-1 {
      width: 450px; height: 450px;
      background: radial-gradient(circle, rgba(21, 128, 61, 0.12) 0%, rgba(21, 128, 61, 0) 70%);
      top: -150px; left: -150px;
      animation: float 10s ease-in-out infinite alternate;
    }
    .deco-2 {
      width: 350px; height: 350px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, rgba(16, 185, 129, 0) 70%);
      bottom: -100px; right: -100px;
      animation: float 12s ease-in-out infinite alternate-reverse;
    }
    .deco-3 {
      width: 250px; height: 250px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.08) 0%, rgba(245, 158, 11, 0) 70%);
      top: 50%; right: 10%;
    }
    @keyframes float {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-30px) scale(1.05); }
    }

    .login-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
    }

    /* Brand Header */
    .brand {
      text-align: center;
      margin-bottom: 2rem;
    }
    .brand h1 {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }
    .brand h1 span {
      color: var(--primary);
    }
    .brand p {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
      font-weight: 500;
    }

    /* Card Layout */
    .card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-color);
      backdrop-filter: blur(10px);
    }
    .card-header {
      text-align: center;
      margin-bottom: 1.8rem;
    }
    .card-header h2 {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 0.3rem;
    }
    .card-header p {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 0.5rem;
    }
    .input-wrapper {
      position: relative;
    }
    .input-wrapper .input-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.9rem;
      transition: color 0.2s;
    }
    .input-wrapper input {
      width: 100%;
      padding: 0.85rem 2.8rem 0.85rem 2.75rem;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      color: var(--text-main);
      background: #f8fafc;
      transition: all 0.2s ease;
      outline: none;
    }
    .input-wrapper input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3.5px var(--primary-glow);
      background: #ffffff;
    }
    .input-wrapper:focus-within .input-icon {
      color: var(--primary);
    }
    .toggle-password {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
      padding: 0.25rem;
      transition: color 0.2s;
    }
    .toggle-password:hover {
      color: var(--primary);
    }

    /* Alert Message */
    .alert-error {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #dc2626;
      border-radius: 12px;
      padding: 0.85rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 1.25rem;
      animation: shake 0.4s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .alert-error.hidden { display: none; }

    /* Submit Button */
    .btn-login {
      width: 100%;
      padding: 0.95rem;
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: white;
      border: none;
      border-radius: 12px;
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      transition: all 0.25s ease;
      box-shadow: 0 4px 16px var(--primary-glow);
      margin-top: 0.5rem;
    }
    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px var(--primary-glow);
    }
    .btn-login:active {
      transform: translateY(0);
    }
    .btn-login.loading {
      pointer-events: none;
      opacity: 0.8;
    }
    .btn-login .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    .btn-login.loading .spinner { display: inline-block; }
    .btn-login.loading .btn-text { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .security-note {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }
    .security-note i { color: var(--primary); font-size: 0.7rem; }

    @media (max-width: 480px) {
      .card { padding: 2rem 1.5rem; }
    }
  </style>
</head>
<body>

  <div class="deco deco-1"></div>
  <div class="deco deco-2"></div>
  <div class="deco deco-3"></div>

  <div class="login-wrapper">
    <div class="brand">
      <img src="assets/images/logo.png" alt="Revo Dev Logo" style="width: 64px; height: 64px; object-fit: contain; border-radius: 16px; background: #ffffff; padding: 4px; margin-bottom: 1rem; box-shadow: 0 8px 32px rgba(21,128,61,0.25);" />
      <h1>Revo<span>Dev</span></h1>
      <p>Panneau d'Administration Sécurisé</p>
    </div>

    <div class="card">
      <div class="card-header">
        <h2><i class="fa-solid fa-lock" style="color: var(--primary); margin-right: 0.4rem;"></i>Connexion</h2>
        <p>Entrez vos identifiants pour accéder au panneau admin</p>
      </div>

      <div id="alertError" class="alert-error hidden">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="alertMessage">Identifiants incorrects. Veuillez réessayer.</span>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Nom d'utilisateur</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-user input-icon"></i>
            <input type="text" id="username" name="username" placeholder="admin" autocomplete="username" required />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-key input-icon"></i>
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
            <button type="button" class="toggle-password" id="togglePwd" title="Afficher/masquer">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
          <div class="spinner"></div>
          <span class="btn-text"><i class="fa-solid fa-arrow-right-to-bracket"></i> Accéder au panneau</span>
        </button>
      </form>

      <div class="security-note">
        <i class="fa-solid fa-lock"></i>
        Connexion sécurisée par chiffrement bcrypt
      </div>
    </div>
  </div>



  <script>
    // Toggle password visibility
    document.getElementById('togglePwd').addEventListener('click', function () {
      const input = document.getElementById('password');
      const icon = this.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-regular fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fa-regular fa-eye';
      }
    });

    // Login form submit
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const btn = document.getElementById('loginBtn');
      const alertEl = document.getElementById('alertError');
      const alertMsg = document.getElementById('alertMessage');

      // Hide error and show loading
      alertEl.classList.add('hidden');
      btn.classList.add('loading');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          // Redirect to admin panel
          window.location.href = '/admin/dashboard';
        } else {
          alertMsg.textContent = data.error || 'Identifiants incorrects. Veuillez réessayer.';
          alertEl.classList.remove('hidden');
          // Re-trigger animation
          alertEl.style.animation = 'none';
          alertEl.offsetHeight; // reflow
          alertEl.style.animation = '';
        }
      } catch (err) {
        alertMsg.textContent = 'Erreur de connexion au serveur. Veuillez réessayer.';
        alertEl.classList.remove('hidden');
      } finally {
        btn.classList.remove('loading');
      }
    });
  </script>
</body>
</html>
